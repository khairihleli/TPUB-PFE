services:
  postgres:
    image: postgres:16-alpine
    container_name: zelqane-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zelqane_postgres_data:/var/lib/postgresql/data
    networks:
      - zelqane_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zelqane-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - zelqane_pgadmin_data:/var/lib/pgadmin
    networks:
      - zelqane_network
    depends_on:
      postgres:
        condition: service_healthy

  # The backend reads its configuration from .env (env_file). JWT_SECRET is REQUIRED (≥ 32 bytes, never
  # the value once committed to git): without it the container stops at startup with a clear message.
  # Recommended as well: MEDIA_SIGNING_SECRET, TOTP_ENCRYPTION_KEY, ZELQANE_ADMIN_INITIAL_PASSWORD and
  # ZELQANE_TOTP_REQUIRED_ROLES=ADMINISTRATEUR,SUPERVISEUR,OPERATEUR (see .env.example).
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: zelqane-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - zelqane_uploads:/app/uploads
    networks:
      - zelqane_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zelqane_postgres_data:
    name: zelqane_postgres_data
  zelqane_pgadmin_data:
    name: zelqane_pgadmin_data
  zelqane_uploads:
    name: zelqane_uploads

networks:
  zelqane_network:
    name: zelqane_network
    driver: bridge
