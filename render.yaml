# Render blueprint — ZELQANE backend (Spring Boot, Docker) on the free plan.
# Database: Neon PostgreSQL (free), see deploy/render-neon/README.md.
# Secrets (sync: false) are set in the Render dashboard or through the API, never in git.
services:
  - type: web
    name: zelqane-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/complete-cahier-des-charges
    dockerContext: ./BackEnd
    dockerfilePath: ./BackEnd/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      # Free instance = 512 MB: small heap, serial GC, few threads.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "40"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: ZELQANE_TIMEZONE
        value: Africa/Tunis
      - key: CORS_ALLOWED_ORIGINS
        value: https://zelqane.com,https://www.zelqane.com
      # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDIA_SIGNING_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: ZELQANE_ADMIN_INITIAL_PASSWORD
        sync: false
