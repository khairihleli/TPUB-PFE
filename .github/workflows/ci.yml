name: CI — Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'BackEnd/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'BackEnd/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Maven Build & Tests
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21

    defaults:
      run:
        working-directory: BackEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: mvn -B clean test

      - name: Build application JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: zelqane-backend-jar
          path: BackEnd/target/BackEnd-*.jar
          retention-days: 7

  flyway-validation:
    name: Flyway Migration Check
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zelqane
          POSTGRES_USER: zelqane_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zelqane_user -d zelqane"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: zelqane-backend-jar
          path: app-jar

      - name: Start app against PostgreSQL (Flyway + JPA validate)
        run: |
          JAR=$(ls app-jar/BackEnd-*.jar | head -1)
          echo "Starting $JAR"
          java -jar "$JAR" &
          echo $! > app.pid
        env:
          SPRING_PROFILES_ACTIVE: docker
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: zelqane
          POSTGRES_USER: zelqane_user
          POSTGRES_PASSWORD: ci_test_password
          SPRING_DATASOURCE_USERNAME: zelqane_user
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          JWT_SECRET: ci_jwt_secret_min_32_characters_long_xx

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 5
          done
          echo "Application failed to start"
          exit 1

      - name: Stop application
        if: always()
        run: kill $(cat app.pid) 2>/dev/null || true
