spring:
  application:
    name: ${SPRING_APPLICATION_NAME:zelqane-backend}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:zelqane}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:zelqane_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: zelqane-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${FLYWAY_SCHEMA:public}
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 60MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Application-specific properties (consumed by future Java @ConfigurationProperties)
zelqane:
  jwt:
    # No default: startup fails with a clear message when JWT_SECRET is missing or shorter than 32 bytes
    # (config/SecretsValidator). The secret once committed to git history is compromised: never reuse it.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    base-url: ${MEDIA_BASE_URL:/uploads}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:52428800}
    max-files-per-campaign: ${MEDIA_MAX_FILES_PER_CAMPAIGN:5}
    # Signed media URLs (empty secret → derived from JWT_SECRET)
    signing-secret: ${MEDIA_SIGNING_SECRET:}
    signed-url-ttl-seconds: ${MEDIA_SIGNED_URL_TTL_SECONDS:3600}
  # AI analysis (docs/round2-contract.md §2.1), bound by config/AiAnalysisProperties
  analysis:
    ocr:
      # auto (Tess4J when tessdata is readable, else simulated) | tess4j | simulated
      mode: ${ZELQANE_OCR_MODE:auto}
      # Folder of the *.traineddata files (BackEnd/scripts/fetch-tessdata.ps1|.sh; /app/tessdata in Docker)
      tessdata-path: ${ZELQANE_OCR_TESSDATA:./tessdata}
      languages: ${ZELQANE_OCR_LANGUAGES:fra+eng+ara}
    provider:
      # Optional LLM vision moderation; the local analysis always runs. local | openai | anthropic
      type: ${ZELQANE_AI_PROVIDER:local}
      timeout-ms: ${ZELQANE_AI_PROVIDER_TIMEOUT_MS:90000}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:gpt-4o-mini}
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:}
        model: ${ANTHROPIC_MODEL:claude-opus-5}
    learning:
      enabled: ${ZELQANE_AI_LEARNING_ENABLED:true}
      auto-apply: ${ZELQANE_AI_LEARNING_AUTO_APPLY:true}
  timezone: ${ZELQANE_TIMEZONE:Africa/Tunis}
  scheduler:
    enabled: ${ZELQANE_SCHEDULER_ENABLED:true}
  reservation:
    temporary-ttl-hours: ${ZELQANE_RESERVATION_TTL_HOURS:72}
  diffusion:
    max-per-hour: ${ZELQANE_DIFFUSION_MAX_PER_HOUR:30}
    default-duration-seconds: ${ZELQANE_DIFFUSION_DEFAULT_DURATION:10}
    default-title: "${ZELQANE_DIFFUSION_DEFAULT_TITLE:ZELQANE — Tukhnanutha}"
    default-content: "${ZELQANE_DIFFUSION_DEFAULT_CONTENT:Espace de diffusion ZELQANE}"
    default-media-url: ${ZELQANE_DIFFUSION_DEFAULT_MEDIA_URL:}
    # ?datetime= of /api/diffusion/next is honoured only when true (local demo profile)
    simulated-time-enabled: ${ZELQANE_SIMULATED_TIME_ENABLED:false}
  # Internal simulation constants (estimation only, never shown on marketing pages)
  pricing:
    base-views-per-hour:
      ECRAN: 120
      PANNEAU_NUMERIQUE: 90
      POINT_WIFI: 40
      APPLICATION: 200
      SITE_WEB: 250
    cpm-tnd:
      ECRAN: 8.000
      PANNEAU_NUMERIQUE: 6.000
      POINT_WIFI: 3.000
      APPLICATION: 4.000
      SITE_WEB: 3.500
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  security:
    session-touch-seconds: ${ZELQANE_SESSION_TOUCH_SECONDS:60}
    totp:
      issuer: ${ZELQANE_TOTP_ISSUER:ZELQANE}
      # Empty → derived from JWT_SECRET (rotating JWT_SECRET then invalidates every TOTP secret)
      encryption-key: ${TOTP_ENCRYPTION_KEY:}
      # Comma list among ADMINISTRATEUR, SUPERVISEUR, OPERATEUR (recommended in production: all three)
      required-roles: ${ZELQANE_TOTP_REQUIRED_ROLES:}
      challenge-ttl-seconds: 300
      max-attempts: 5
    bootstrap-admin:
      email: ${ZELQANE_ADMIN_EMAIL:admin@zelqane.local}
      # Empty → a random password is generated and printed once in the log
      initial-password: ${ZELQANE_ADMIN_INITIAL_PASSWORD:}
      must-change-password: ${ZELQANE_ADMIN_MUST_CHANGE_PASSWORD:true}
  device:
    rate-limit:
      per-minute: 120
      burst: 30
    invalid-key-per-minute-per-ip: 20
    touch-seconds: 60

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Local development profile — verbose logging, localhost database
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.zelqanepfe: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

---
# Local demo profile (start-local.ps1) — simulated player time allowed, INFO logging
spring:
  config:
    activate:
      on-profile: local

zelqane:
  diffusion:
    simulated-time-enabled: true

logging:
  level:
    com.example.zelqanepfe: INFO
    org.hibernate.SQL: WARN

---
# Docker profile — backend container talking to postgres service on bridge network
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:zelqane}

logging:
  level:
    com.example.zelqanepfe: INFO
    org.hibernate.SQL: WARN
