spring:
  application:
    name: ${SPRING_APPLICATION_NAME:tpub-backend}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tpub}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:tpub_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: tpub-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${FLYWAY_SCHEMA:public}
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Application-specific properties (consumed by future Java @ConfigurationProperties)
tpub:
  jwt:
    secret: ${JWT_SECRET:change_me_jwt_secret_min_32_characters_long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    base-url: ${MEDIA_BASE_URL:/uploads}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:5000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:30000}
    openai-enabled: ${OPENAI_ENABLED:true}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Local development profile — verbose logging, localhost database
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.tpubpfe: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

---
# Docker profile — backend container talking to postgres service on bridge network
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:tpub}

logging:
  level:
    com.example.tpubpfe: INFO
    org.hibernate.SQL: WARN
