spring:
  application:
    name: ${SPRING_APPLICATION_NAME:tpub-backend}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tpub}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:tpub_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: tpub-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${FLYWAY_SCHEMA:public}
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 60MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Application-specific properties (consumed by future Java @ConfigurationProperties)
tpub:
  jwt:
    secret: ${JWT_SECRET:change_me_jwt_secret_min_32_characters_long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    base-url: ${MEDIA_BASE_URL:/uploads}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:52428800}
    max-files-per-campaign: ${MEDIA_MAX_FILES_PER_CAMPAIGN:5}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:5000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:30000}
    openai-enabled: ${OPENAI_ENABLED:true}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    ocr:
      mode: ${TPUB_OCR_MODE:auto}
      command: ${TPUB_OCR_COMMAND:tesseract}
      languages: ${TPUB_OCR_LANGUAGES:fra+eng}
  timezone: ${TPUB_TIMEZONE:Africa/Tunis}
  scheduler:
    enabled: ${TPUB_SCHEDULER_ENABLED:true}
  reservation:
    temporary-ttl-hours: ${TPUB_RESERVATION_TTL_HOURS:72}
  diffusion:
    max-per-hour: ${TPUB_DIFFUSION_MAX_PER_HOUR:30}
    default-duration-seconds: ${TPUB_DIFFUSION_DEFAULT_DURATION:10}
    default-title: "${TPUB_DIFFUSION_DEFAULT_TITLE:TPUB — Tukhnanutha}"
    default-content: "${TPUB_DIFFUSION_DEFAULT_CONTENT:Espace de diffusion TPUB}"
    default-media-url: ${TPUB_DIFFUSION_DEFAULT_MEDIA_URL:}
  # Internal simulation constants (estimation only, never shown on marketing pages)
  pricing:
    base-views-per-hour:
      ECRAN: 120
      PANNEAU_NUMERIQUE: 90
      POINT_WIFI: 40
      APPLICATION: 200
      SITE_WEB: 250
    cpm-tnd:
      ECRAN: 8.000
      PANNEAU_NUMERIQUE: 6.000
      POINT_WIFI: 3.000
      APPLICATION: 4.000
      SITE_WEB: 3.500
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  security:
    session-touch-seconds: ${TPUB_SESSION_TOUCH_SECONDS:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Local development profile — verbose logging, localhost database
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.tpubpfe: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

---
# Docker profile — backend container talking to postgres service on bridge network
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:tpub}

logging:
  level:
    com.example.tpubpfe: INFO
    org.hibernate.SQL: WARN
